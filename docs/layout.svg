<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="245" viewBox="0 0 1100 245" role="img" aria-labelledby="title desc">
<title id="title">Compact player at the taskbar left edge</title>
<desc id="desc">Cover, track information, previous play next buttons and lyrics fit in about 316 DIPs. Native taskbar icons and tray retain their own space.</desc>
<defs><linearGradient id="cover" x2="1" y2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1100" height="245" rx="16" fill="#111827"/>
<text x="28" y="35" fill="#f9fafb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">Compact layout · Left-edge overlay · About 316 DIPs</text>
<text x="28" y="60" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="13">Illustration, not a Windows screenshot. Enable Layout preview to inspect your actual taskbar.</text>
<rect x="20" y="110" width="1060" height="58" rx="8" fill="#252c3b"/>
<rect x="38" y="119" width="316" height="40" rx="6" fill="#303a50" stroke="#64748b"/>
<rect x="40" y="125" width="28" height="28" rx="5" fill="url(#cover)"/>
<circle cx="54" cy="139" r="8" fill="#1e293b" opacity=".6"/><circle cx="54" cy="139" r="2" fill="#e0e7ff"/>
<text x="72" y="136" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Song title…</text>
<text x="72" y="150" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Artist name</text>
<g fill="#f3f4f6"><path d="M161 133v12h-2v-12zm1 6 9-6v12z"/><path d="M185 133v12h3v-12zm5 0v12h3v-12z"/><path d="m209 133 9 6-9 6zm11 0v12h2v-12z"/></g>
<text x="292" y="136" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Your synchronized</text>
<text x="292" y="150" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">lyric line</text>
<g fill="#94a3b8"><rect x="490" y="127" width="24" height="24" rx="5"/><rect x="536" y="127" width="24" height="24" rx="5"/><rect x="582" y="127" width="24" height="24" rx="5"/></g>
<text x="642" y="144" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="13">Windows app icons</text>
<text x="944" y="143" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="12">Tray · Clock</text>
<g stroke="#64748b" fill="none"><path d="M54 156v24"/><path d="M108 156v48"/><path d="M190 156v24"/><path d="M292 156v48"/></g>
<g fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12"><text x="30" y="196">Cover</text><text x="80" y="224">Track info</text><text x="153" y="196">Controls</text><text x="275" y="224">Lyrics</text></g>
</svg>
